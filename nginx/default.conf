map $uri $safe_request_uri {
    "~^/join/[A-Za-z0-9_-]{43}/?$" /join/[redacted];
    "~^/api/invitations/[A-Za-z0-9_-]{43}/preview$" /api/invitations/[redacted]/preview;
    default $uri;
}

log_format siga_privacy '$remote_addr [$time_local] "$request_method $safe_request_uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
access_log /var/log/nginx/access.log siga_privacy;

map $request_uri $is_direct_html_request {
    default 0;
    ~*\.html(?:\?.*)?$ 1;
}

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;
    include /etc/nginx/security-headers.conf;

    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/security-headers.conf;
        try_files /.well-known/apple-app-site-association =404;
    }

    # Only the AASA above is a public dotfile resource.
    location ~ (^|/)\. { return 404; }
    location ~* ^/(nginx|tests|review-drafts|deploy)(/|$) { return 404; }
    location ~* /Dockerfile$ { return 404; }
    location ~* \.(conf|cjs|md|ya?ml|sql|bak|key|pem|p8)$ { return 404; }

    # Caddy handles the exact public invitation-preview route before reaching web.
    # Do not proxy from this container: it would merge visitors into one API IP bucket.
    location /api/ { return 404; }

    location = /join {
        return 404;
    }

    location ~ "^/join/[A-Za-z0-9_-]{43}/?$" {
        try_files /join/index.html =404;
    }

    location = /en/ {
        return 301 /en$is_args$args;
    }

    location = /en {
        try_files /en.html =404;
    }

    # Serve canonical legal documents directly; legacy redirects keep language and query.
    location = /privacidad { try_files /privacidad.html =404; }
    location = /privacidad.html { return 301 /privacidad$is_args$args; }
    location = /soporte { try_files /soporte.html =404; }
    location = /soporte.html { return 301 /soporte$is_args$args; }
    location = /terminos { try_files /terminos.html =404; }
    location = /terminos.html { return 301 /terminos$is_args$args; }
    location = /normas-juntos { try_files /normas-juntos.html =404; }
    location = /normas-juntos.html { return 301 /normas-juntos$is_args$args; }
    location = /en/privacy { try_files /en/privacy.html =404; }
    location = /en/privacy.html { return 301 /en/privacy$is_args$args; }
    location = /en/support { try_files /en/support.html =404; }
    location = /en/support.html { return 301 /en/support$is_args$args; }
    location = /en/terms { try_files /en/terms.html =404; }
    location = /en/terms.html { return 301 /en/terms$is_args$args; }
    location = /en/community { try_files /en/community.html =404; }
    location = /en/community.html { return 301 /en/community$is_args$args; }

    location = /index.html {
        if ($is_direct_html_request) {
            return 301 /;
        }

        try_files /index.html =404;
    }

    location ~ ^/(.+)\.html$ {
        if ($is_direct_html_request) {
            return 301 /$1$is_args$args;
        }

        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ @extensionless;
    }

    location @extensionless {
        rewrite ^/(.+?)/?$ /$1.html last;
    }
}
