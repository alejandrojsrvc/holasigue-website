map $uri $safe_request_uri {
    "~^/join/[A-Za-z0-9_-]{43}/?$" /join/[redacted];
    "~^/api/invitations/[A-Za-z0-9_-]{43}/preview$" /api/invitations/[redacted]/preview;
    default $request_uri;
}

log_format siga_privacy '$remote_addr [$time_local] "$request_method $safe_request_uri $server_protocol" $status $body_bytes_sent "$http_user_agent"';
access_log /var/log/nginx/access.log siga_privacy;

server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    location = /.well-known/apple-app-site-association {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        try_files /.well-known/apple-app-site-association =404;
    }

    location = /join {
        return 404;
    }

    location ~ "^/join/[A-Za-z0-9_-]{43}/?$" {
        try_files /join/index.html =404;
    }

    location ~ "^/api/invitations/([A-Za-z0-9_-]{43})/preview$" {
        limit_except GET { deny all; }
        proxy_set_header Host api.holasigue.com;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_pass http://sigue-api-umbs8w:3000/v1/invitations/$1/preview;
    }

    location / {
        try_files $uri $uri/ @extensionless;
    }

    location @extensionless {
        rewrite ^/(.+?)/?$ /$1.html last;
    }
}
