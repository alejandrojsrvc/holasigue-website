<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>SIGUE — Choose your language</title>
  <link rel="icon" href="/assets/sigue-icon.png" type="image/png">
  <link rel="alternate" hreflang="es" href="https://holasigue.com/es">
  <link rel="alternate" hreflang="en" href="https://holasigue.com/en">
  <link rel="alternate" hreflang="x-default" href="https://holasigue.com/">
  <script>
    const browserLanguage = (navigator.languages?.[0] || navigator.language || '').toLowerCase();
    try {
      const saved = localStorage.getItem('sigue-language');
      const language = saved === 'es' || saved === 'en' ? saved : browserLanguage.startsWith('es') ? 'es' : 'en';
      location.replace('/' + language + location.search + location.hash);
    } catch {
      location.replace(browserLanguage.startsWith('es') ? '/es' : '/en');
    }
  </script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <main class="language-gateway shell">
    <img src="/assets/sigue-icon.png" alt="" width="90" height="90">
    <h1>SIGUE</h1>
    <p>Choose your language / Elige tu idioma</p>
    <nav aria-label="Language / Idioma"><a href="/es" lang="es">Español</a><a href="/en" lang="en">English</a></nav>
  </main>
</body>
</html>
