<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#FCC54E">
  <title>Invitación a SIGUE</title>
  <link rel="icon" href="/assets/sigue-icon.png" type="image/png">
  <link rel="stylesheet" href="/join/join.css">
  <script src="/join/join.js" defer></script>
</head>
<body>
  <main class="invite-shell">
    <a class="brand" href="/" aria-label="SIGUE, inicio">
      <img src="/assets/sigue-icon.png" alt="" width="48" height="48">
      <span>SIGUE</span>
    </a>

    <section class="invite-card" aria-labelledby="invite-title" aria-live="polite">
      <div class="group-mark" id="group-icon" aria-hidden="true">S</div>
      <p class="eyebrow" id="invite-eyebrow">JUNTOS, A TU RITMO</p>
      <h1 id="invite-title">Estamos buscando tu invitación</h1>
      <p class="lead" id="invite-description">Un momento, por favor.</p>

      <div class="challenge" id="challenge" hidden>
        <strong id="challenge-name"></strong>
        <span id="challenge-summary"></span>
      </div>

      <p class="member-count" id="member-count" hidden></p>
      <a class="button" id="download-link" href="https://apps.apple.com/ar/app/sigue-h%C3%A1bitos-y-bienestar/id6803143413">
        Descargar SIGUE en App Store <span aria-hidden="true">↗</span>
      </a>
      <p class="return-hint" id="return-hint" hidden>
        Después de instalar SIGUE, vuelve a este enlace para abrir la invitación en la app.
      </p>
      <a class="home-link" href="/">Conoce SIGUE</a>
    </section>
    <p class="footer-note">Tus datos personales siguen siendo tuyos.</p>
  </main>
</body>
</html>
